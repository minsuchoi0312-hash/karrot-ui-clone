<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3f4c"/><stop offset="1" stop-color="#262a33"/></linearGradient>
    <radialGradient id="cone" cx=".55" cy=".05" r="1"><stop offset="0" stop-color="#ffe9b5" stop-opacity=".75"/><stop offset=".7" stop-color="#ffe9b5" stop-opacity="0"/></radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6d7c1"/><stop offset="1" stop-color="#cdb99c"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fafafa"/><stop offset="1" stop-color="#d6d9de"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <rect y="292" width="400" height="108" fill="url(#desk)"/>
  <path d="M188 148L92 292h250z" fill="url(#cone)"/>
  <ellipse cx="220" cy="300" rx="120" ry="20" fill="#fff3d1" opacity=".55" filter="url(#blur)"/>
  <!-- base -->
  <ellipse cx="112" cy="296" rx="46" ry="10" fill="#000" opacity=".25"/>
  <rect x="72" y="278" width="80" height="16" rx="8" fill="url(#metal)"/>
  <!-- arms -->
  <g stroke="url(#metal)" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M112 280l26-118"/>
    <path d="M138 162l82-30"/>
  </g>
  <circle cx="138" cy="162" r="10" fill="#e4e6ea"/>
  <circle cx="112" cy="280" r="7" fill="#cfd3d8"/>
  <!-- head -->
  <g transform="rotate(28 222 134)">
    <path d="M196 110h60l14 52h-88z" fill="url(#metal)"/>
    <ellipse cx="226" cy="162" rx="44" ry="8" fill="#fff6d8"/>
    <rect x="216" y="98" width="20" height="14" rx="4" fill="#e4e6ea"/>
  </g>
  <!-- book on desk -->
  <rect x="230" y="306" width="110" height="18" rx="3" fill="#7d93b5"/>
  <rect x="236" y="296" width="96" height="12" rx="2" fill="#e88f6a"/>
</svg>
