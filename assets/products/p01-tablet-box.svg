<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8edf3"/><stop offset="1" stop-color="#d4dbe4"/></linearGradient>
    <linearGradient id="boxTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef0f3"/></linearGradient>
    <linearGradient id="boxSide" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3e6ea"/><stop offset="1" stop-color="#cfd3d9"/></linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7584ff"/><stop offset=".6" stop-color="#b57cf2"/><stop offset="1" stop-color="#ff9d86"/></linearGradient>
    <linearGradient id="brick" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e4e6ea"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <ellipse cx="190" cy="300" rx="150" ry="22" fill="#2b3340" opacity=".22" filter="url(#blur)"/>
  <!-- box -->
  <path d="M60 150l150-52 140 46-150 54z" fill="url(#boxTop)"/>
  <path d="M60 150l140 48v104L60 256z" fill="url(#boxSide)"/>
  <path d="M200 198l150-54v104l-150 54z" fill="#dde1e6"/>
  <path d="M60 150l150-52 140 46" fill="none" stroke="#fff" stroke-width="2"/>
  <!-- printed tablet on the lid -->
  <path d="M124 150l78-27 64 21-78 28z" fill="url(#art)" opacity=".95"/>
  <path d="M124 150l78-27 64 21-78 28z" fill="none" stroke="#3a3d44" stroke-width="5" stroke-linejoin="round"/>
  <!-- charger + cable -->
  <rect x="262" y="226" width="56" height="56" rx="12" fill="url(#brick)" stroke="#d2d6dc"/>
  <rect x="282" y="218" width="16" height="10" rx="2" fill="#c7ccd3"/>
  <path d="M290 282c0 30-40 38-80 30s-70 4-74 24 30 30 70 22" fill="none" stroke="#f9fafb" stroke-width="7" stroke-linecap="round"/>
  <path d="M290 282c0 30-40 38-80 30s-70 4-74 24 30 30 70 22" fill="none" stroke="#d6dae0" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 14" opacity=".6"/>
  <rect x="200" y="350" width="20" height="10" rx="3" fill="#f1f3f5" stroke="#cdd2d8"/>
</svg>
